# DigitalOcean App Platform spec. Create with: doctl apps create --spec .do/app.yaml
# Uses a plain public git source (no DigitalOcean GitHub app needed).
# Redeploy after pushing: doctl apps create-deployment <app-id>
name: ballotty
region: sfo
services:
  - name: web
    environment_slug: python
    git:
      repo_clone_url: https://github.com/dalmartin/ballotty.git
      branch: main
    build_command: pip install -r requirements.txt
    run_command: uvicorn app.main:app --host 0.0.0.0 --port 8080
    http_port: 8080
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1
    health_check:
      http_path: /healthz
