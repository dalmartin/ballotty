<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ballotty</title>
  <meta name="description" content="Your Oregon ballot at a glance. Every point links to the official voters' pamphlet page it came from.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <a class="logo" href="#">Ballotty</a>
      <div class="search" role="search">
        <i data-lucide="search" aria-hidden="true"></i>
        <input id="q" type="search" list="topic-list" placeholder="Search issues or candidates: housing, taxes, Kotek" autocomplete="off" aria-label="Search issues or candidates">
        <datalist id="topic-list"></datalist>
      </div>
      <div class="top-right">
      <button type="button" class="how" data-how><i data-lucide="shield-check" aria-hidden="true"></i><span>How we checked</span></button>
      <label class="city-pick"><span class="sr">City</span>
        <select id="city" aria-label="City"></select>
      </label>
      </div>
    </div>
  </header>

  <div class="shell">
    <nav class="rail" id="rail" aria-label="Contests on your ballot"></nav>
    <main class="main" id="main"><p class="loading">Loading your ballot</p></main>
  </div>

  <footer class="foot"><div class="foot-inner" id="foot"></div></footer>

  <div class="scrim" id="scrim" hidden></div>
  <aside class="drawer" id="drawer" aria-label="Source" hidden></aside>
  <div class="print-sheet" id="print-sheet"></div>
  <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
